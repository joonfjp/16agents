<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><div id="app"></div>
<script src="assets/ati.js"></script>
<script>
(async () => {
  const app = document.getElementById("app");
  const h = location.hash.slice(1);
  if (!h.startsWith("r=")) { location.replace("./#paste"); return; }
  try { ATI.report(await ATI.decode(h), app); window.scrollTo(0, 0); }
  catch (e) { app.innerHTML = `<header class="top"><a class="logo" href="./">16<span>agents</span></a></header><section class="sec"><h2>That link is broken 🫠</h2><p class="lead">It may have been cut off when it was shared. <a href="./#paste">Paste the raw answers instead</a>.</p><pre>${ATI.esc(e.message)}</pre></section>`; }
})();
window.addEventListener("hashchange", () => location.reload());
</script>
</body></html>
